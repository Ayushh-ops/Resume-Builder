<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/><polyline points='14 2 14 8 20 8'/><line x1='16' y1='13' x2='8' y2='13'/><line x1='16' y1='17' x2='8' y2='17'/><polyline points='10 9 9 9 8 9'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResumeCraft — Resume Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=JetBrains+Mono:wght@400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var legacy = localStorage.getItem('resumecraft_app_theme');
          var legacyAcc = localStorage.getItem('resumecraft_app_accent');
          if (legacy || legacyAcc) {
            localStorage.setItem('rc-theme', legacy === 'dark' ? 'navy' : 'light');
            if (legacyAcc) localStorage.setItem('rc-accent', legacyAcc);
            localStorage.removeItem('resumecraft_app_theme');
            localStorage.removeItem('resumecraft_app_accent');
          }
          var accents = {
            light: '180 69 31',
            navy: '99 102 241',
            inkblue: '56 189 248',
            dark: '224 122 79',
            midnight: '224 122 79',
            forest: '61 139 104',
            rose: '171 72 92',
            slate: '68 81 99'
          };
          var hexMap = {
            light: '#b4451f',
            navy: '#6366f1',
            inkblue: '#38bdf8',
            dark: '#e07a4f',
            midnight: '#e07a4f',
            forest: '#3d8b68',
            rose: '#ab485c',
            slate: '#445163'
          };
          var valid = ['light', 'navy', 'inkblue', 'dark', 'midnight', 'forest', 'rose', 'slate'];
          var saved = localStorage.getItem('rc-theme');
          var theme = (saved && valid.indexOf(saved) !== -1)
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'navy' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.removeAttribute('data-accent');

          var savedAccent = localStorage.getItem('rc-accent');
          var rgb = accents[theme] || '180 69 31';
          var hex = hexMap[theme] || '#b4451f';
          if (savedAccent && /^#[0-9a-fA-F]{6}$/.test(savedAccent)) {
            hex = savedAccent;
            var num = parseInt(savedAccent.slice(1), 16);
            rgb = (num >> 16) + ' ' + ((num >> 8) & 255) + ' ' + (num & 255);
          }
          document.documentElement.style.setProperty('--brand-600', rgb);
          document.documentElement.style.setProperty('--app-accent', hex);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
