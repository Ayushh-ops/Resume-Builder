<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/><polyline points='14 2 14 8 20 8'/><line x1='16' y1='13' x2='8' y2='13'/><line x1='16' y1='17' x2='8' y2='17'/><polyline points='10 9 9 9 8 9'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResumeCraft AI — Intelligent ATS Resume Builder & Career Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var legacy = localStorage.getItem('resumecraft_app_theme');
          if (legacy) {
            localStorage.setItem('rc-theme', legacy === 'dark' ? 'dark' : 'light');
            localStorage.removeItem('resumecraft_app_theme');
            localStorage.removeItem('resumecraft_app_accent');
          }
          var saved = localStorage.getItem('rc-theme');
          var valid = ['light', 'dark', 'midnight', 'forest', 'rose', 'slate'];
          var theme = (saved && valid.indexOf(saved) !== -1)
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.removeAttribute('data-accent');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
